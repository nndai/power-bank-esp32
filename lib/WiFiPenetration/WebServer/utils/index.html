<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 WiFi Penetration Tool</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f1f5f9;
            --text-muted: #94a3b8;
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --danger-color: #ef4444;
            --danger-hover: #dc2626;
            --success-color: #22c55e;
            --border-color: #334155;
            --input-bg: #0f172a;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 30px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        h1 {
            color: var(--primary-color);
            margin: 0;
            font-weight: 700;
        }

        h2 {
            font-size: 1.25rem;
            margin-top: 0;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .grid {
                grid-template-columns: 2fr 1fr; /* AP List takes more space */
            }
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* Tables */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle; /* Ensure vertical centering in table cells */
        }

        th {
            background-color: rgba(0,0,0,0.2);
            font-weight: 600;
            color: var(--text-muted);
        }

        tr:hover {
            background-color: rgba(255,255,255,0.05);
            cursor: pointer;
        }

        tr.selected {
            background-color: rgba(59, 130, 246, 0.2);
            border-left: 3px solid var(--primary-color);
        }

        /* Forms & Inputs */
        label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        select, input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            box-sizing: border-box; 
            vertical-align: middle;
        }
        
        select:focus, input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        /* Buttons */
        button {
            display: inline-flex; /* Use flexbox for centering */
            align-items: center;  /* Vertical center */
            justify-content: center; /* Horizontal center */
            background-color: var(--primary-color);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s;
            width: 100%;
            line-height: normal; /* Reset line-height */
            vertical-align: middle;
        }

        button:hover {
            background-color: var(--primary-hover);
        }
        
        button.btn-sm {
            width: auto;
            padding: 6px 12px;
            font-size: 0.85rem;
        }

        button.btn-danger {
            background-color: var(--danger-color);
        }

        button.btn-danger:hover {
            background-color: var(--danger-hover);
        }
        
        /* Status & Logs */
        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            background-color: var(--border-color);
        }

        .status-running { background-color: var(--primary-color); }
        .status-finished { background-color: var(--success-color); }
        .status-error { background-color: var(--danger-color); }

        pre {
            background-color: #000;
            padding: 10px;
            border-radius: 6px;
            overflow-x: auto;
            font-family: 'Consolas', monospace;
            font-size: 0.85rem;
        }
        
        code {
            color: var(--primary-color);
        }

        #loading, #errors {
            text-align: center;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        
        #errors {
            background-color: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid var(--danger-color);
            display: none;
        }

        .hidden { display: none !important; }
        
        /* Progress Overlay */
        #running {
            text-align: center;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: var(--primary-color);
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Responsive MAC Address */
        .mac-address {
            font-family: monospace;
        }
        
        @media (max-width: 600px) {
            .mac-address {
                font-size: 0.7em; /* Smaller font on mobile */
            }
        }

    </style>
</head>
<body onLoad="getStatus()">
    <div class="container">
        <header>
            <h1>⚡ Wi-Fi Penetration Tool</h1>
        </header>

        <section id="errors"></section>
        <section id="loading">Loading interface...</section>

        <!-- MAIN LAYOUT -->
        <div id="ready" class="grid hidden">
            
            <!-- LEFT COLUMN: TARGETS -->
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <h2>Nearby Access Points</h2>
                    <button type="button" class="btn-sm" onClick="refreshAps()">Refresh</button>
                </div>
                <div class="table-responsive">
                    <table id="ap-list">
                        <tr><td colspan="3" style="text-align:center;">Click Refresh to scan...</td></tr>
                    </table>
                </div>
            </div>

            <!-- RIGHT COLUMN: CONFIG -->
            <div class="card">
                <h2>Attack Configuration</h2>
                <form onSubmit="runAttack(); return false;">
                    <label for="attack_type">Attack Type</label>
                    <select id="attack_type" onChange="updateConfigurableFields(this)" required>
                        <option value="0" disabled>Passive Monitor (N/A)</option>
                        <option value="1">Handshake Capture</option>
                        <option value="2" selected>PMKID Capture</option>
                        <option value="3">DoS Attack</option>
                    </select>

                    <label for="attack_method">Method</label>
                    <select id="attack_method" required disabled>
                        <option value="" selected disabled hidden>Select Type First</option>
                    </select>

                    <label for="attack_timeout">Timeout (Seconds)</label>
                    <input type="number" min="0" max="255" id="attack_timeout" value="5" required/>
                    
                    <div style="display: flex; justify-content: center; align-items: center;">
                        <button type="submit" class="btn-danger">START ATTACK</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- RUNNING STATE -->
        <section id="running" class="card hidden">
            <h2>Attack in Progress</h2>
            <div class="spinner"></div>
            <p>Time Elapsed: <span id="running-progress" style="font-weight:bold; font-size:1.2rem;">0/60s</span></p>
            <p style="color: var(--text-muted); font-size:0.9rem;">Please do not disconnect...</p>
        </section>

        <!-- RESULT STATE -->
        <section id="result" class="card hidden">
            <h2>Attack Result</h2>
            <div id="result-meta"></div>
            <div id="result-content" style="margin: 20px 0;"></div>
            <button type="button" onClick="resetAttack()">Back to Configuration</button>
        </section>
    </div>

    <script>
    var AttackStateEnum = { READY: 0, RUNNING: 1, FINISHED: 2, TIMEOUT: 3};
    var AttackTypeEnum = { ATTACK_TYPE_PASSIVE: 0, ATTACK_TYPE_HANDSHAKE: 1, ATTACK_TYPE_PMKID: 2, ATTACK_TYPE_DOS: 3};
    var selectedApElement = -1;
    var poll;
    var poll_interval = 1000;
    var running_poll;
    var running_poll_interval = 1000;
    var attack_timeout = 0;
    var time_elapsed = 0;
    
    // Store original select logic
    var defaultAttackMethods = ""; // Will be populated on init

    function getStatus() {
        var oReq = new XMLHttpRequest();
        oReq.onload = function() {
            var arrayBuffer = oReq.response;
            if(arrayBuffer) {
                var attack_state = parseInt(new Uint8Array(arrayBuffer, 0, 1));
                var attack_type = parseInt(new Uint8Array(arrayBuffer, 1, 1));
                var attack_content_size = parseInt(new Uint16Array(arrayBuffer, 2, 1));
                var attack_content = new Uint8Array(arrayBuffer, 4);
                
                // Hide loading
                document.getElementById("loading").classList.add("hidden");
                
                switch(attack_state) {
                    case AttackStateEnum.READY:
                        showAttackConfig();
                        break;
                    case AttackStateEnum.RUNNING:
                        showRunning();
                        setTimeout(getStatus, poll_interval);
                        break;
                    case AttackStateEnum.FINISHED:
                        showResult("FINISHED", attack_type, attack_content_size, attack_content);
                        break;
                    case AttackStateEnum.TIMEOUT:
                        showResult("TIMEOUT", attack_type, attack_content_size, attack_content);
                        break;
                    default:
                        showError("Error: Unknown state " + attack_state);
                }
            }
        };
        oReq.onerror = function() {
            showError("Connection lost! Reconnect to AP.");
            setTimeout(getStatus, 2000); 
        };
        oReq.ontimeout = function() { getStatus(); };
        oReq.open("GET", "/status", true);
        oReq.responseType = "arraybuffer";
        oReq.send();
    }

    function showError(msg) {
        var errEl = document.getElementById("errors");
        errEl.innerHTML = msg;
        errEl.style.display = "block";
    }

    function hideAllSections(){
        document.getElementById("ready").classList.add("hidden");
        document.getElementById("running").classList.add("hidden");
        document.getElementById("result").classList.add("hidden");
    }

    function showRunning(){
        hideAllSections();
        document.getElementById("running").classList.remove("hidden");
    }

    function countProgress(){
        if(time_elapsed >= attack_timeout){
            clearInterval(running_poll);
             // Don't show error immediately, wait for status update to confirm timeout
        }
        document.getElementById("running-progress").innerHTML = time_elapsed + "/" + attack_timeout + "s";
        time_elapsed++;
    }

    function showAttackConfig(){
        // Only refresh APs if we are just switching to ready state for the first time or from another state
        // But to avoid constant refreshing if already visible, check visibility
        if(document.getElementById("ready").classList.contains("hidden")){
            hideAllSections();
            document.getElementById("ready").classList.remove("hidden");
            refreshAps();
            
            // Initialize default methods wrapper if not set
            if(defaultAttackMethods === "") {
                 // Hacky way to store default empty state
                 defaultAttackMethods = document.getElementById("attack_method").innerHTML;
            }
        }
    }

    function showResult(status, attack_type, attack_content_size, attack_content){
        hideAllSections();
        clearInterval(poll);
        clearInterval(running_poll);
        
        document.getElementById("result").classList.remove("hidden");
        
        let statusHtml = "<span class='status-badge " + (status === "FINISHED" ? "status-finished" : "status-error") + "'>" + status + "</span>";
        document.getElementById("result-meta").innerHTML = statusHtml + " ";
        
        let typeName = "UNKNOWN";
        switch(attack_type) {
            case AttackTypeEnum.ATTACK_TYPE_PASSIVE: typeName = "PASSIVE"; break;
            case AttackTypeEnum.ATTACK_TYPE_HANDSHAKE:
                typeName = "HANDSHAKE";
                resultHandshake(attack_content, attack_content_size);
                break;
            case AttackTypeEnum.ATTACK_TYPE_PMKID:
                typeName = "PMKID";
                resultPmkid(attack_content, attack_content_size);
                break;
            case AttackTypeEnum.ATTACK_TYPE_DOS: typeName = "DOS"; break;
        }
        document.getElementById("result-meta").innerHTML += "<strong>" + typeName + "</strong>";
    }

    function refreshAps() {
        var list = document.getElementById("ap-list");
        list.innerHTML = "<tr><td colspan='3' style='text-align:center'>Scanning...</td></tr>";
        
        var oReq = new XMLHttpRequest();
        oReq.onload = function() {
            list.innerHTML = "<thead><tr><th>SSID</th><th>BSSID</th><th>RSSI</th></tr></thead><tbody>";
            var arrayBuffer = oReq.response;
            if(arrayBuffer) {
                var byteArray = new Uint8Array(arrayBuffer);
                // 40 bytes per record
                // 0-32: SSID (33 bytes) ?? No, 33 bytes.
                // 33-38: BSSID (6 bytes)
                // 39: RSSI (1 byte)
                // Wait, previous code said 40 bytes chunk.
                // let's follow the previous logic exactly: i + 33 is BSSID start. So SSID is 0..32 (33 bytes).
                
                var tbody = document.createElement("tbody");
                for (let i = 0; i < byteArray.byteLength; i = i + 40) {
                    var tr = document.createElement('tr');
                    tr.setAttribute("id", i / 40);
                    tr.setAttribute("onClick", "selectAp(this)");
                    
                    var td_ssid = document.createElement('td');
                    // Remove null bytes from SSID
                    let ssidRaw = byteArray.subarray(i + 0, i + 33);
                    // Find null terminator
                    let len = 33;
                    for(let k=0; k<33; k++) { if(ssidRaw[k]==0) { len=k; break; } }
                    td_ssid.innerText = new TextDecoder("utf-8").decode(ssidRaw.subarray(0, len));
                    if(td_ssid.innerText === "") td_ssid.innerText = "<Hidden>";
                    
                    var td_bssid = document.createElement('td');
                    td_bssid.className = "mac-address";
                    let bssidStr = "";
                    for(let j = 0; j < 6; j++){
                        bssidStr += uint8ToHex(byteArray[i + 33 + j]) + (j<5?":":"");
                    }
                    td_bssid.innerText = bssidStr;
                    
                    var td_rssi = document.createElement('td');
                    td_rssi.innerText = (byteArray[i + 39] - 255) + " dBm";
                    
                    tr.appendChild(td_ssid);
                    tr.appendChild(td_bssid);
                    tr.appendChild(td_rssi);
                    tbody.appendChild(tr);
                }
                list.appendChild(tbody);
            }
        };
        oReq.onerror = function() {
            list.innerHTML = "<tr><td colspan='3'>Failed to load APs</td></tr>";
        };
        oReq.open("GET", "/ap-list", true);
        oReq.responseType = "arraybuffer";
        oReq.send();
    }

    function selectAp(el) {
        if(selectedApElement != -1){
            selectedApElement.classList.remove("selected")
        }
        selectedApElement=el;
        el.classList.add("selected");
    }

    function runAttack() {
        if(selectedApElement == -1){
            alert("Please select a target AP from the list first!");
            return;
        }
        
        hideAllSections();
        document.getElementById("running").classList.remove("hidden");
        
        var arrayBuffer = new ArrayBuffer(4);
        var uint8Array = new Uint8Array(arrayBuffer);
        uint8Array[0] = parseInt(selectedApElement.id); // AP ID
        uint8Array[1] = parseInt(document.getElementById("attack_type").value);
        uint8Array[2] = parseInt(document.getElementById("attack_method").value);
        uint8Array[3] = parseInt(document.getElementById("attack_timeout").value);
        
        var oReq = new XMLHttpRequest();
        oReq.open("POST", "/run-attack", true);
        oReq.send(arrayBuffer);
        
        setTimeout(getStatus, 1000); // Start polling status
        
        attack_timeout = parseInt(document.getElementById("attack_timeout").value);
        time_elapsed = 0;
        running_poll = setInterval(countProgress, running_poll_interval);
    }

    function resetAttack(){
        var oReq = new XMLHttpRequest();
        oReq.onload = function() {
             showAttackConfig();
        }
        oReq.open("HEAD", "/reset", true);
        oReq.send();
    }

    function resultPmkid(attack_content, attack_content_size){
        // Parsing logic from original
        var mac_ap = "";
        var mac_sta = "";
        var ssid = "";
        var ssid_text = "";
        var index = 0;
        
        // Helper to safe hex
        for(let i = 0; i < 6; i++) { mac_ap += uint8ToHex(attack_content[index + i]); }
        index += 6;
        for(let i = 0; i < 6; i++) { mac_sta += uint8ToHex(attack_content[index + i]); }
        index += 6;
        
        let ssidLen = attack_content[index];
        for(let i = 0; i < ssidLen; i++) {
            ssid += uint8ToHex(attack_content[index + 1 + i]);
            ssid_text += String.fromCharCode(attack_content[index + 1 + i]);
        }
        index += (ssidLen + 1);
        
        // PMKIDs
        var pmkidsHtml = "";
        for(let i = 0; i < attack_content_size - index; i++) {
            if(i % 16 == 0){
                if(i > 0) pmkidsHtml += "<br>";
                pmkidsHtml += (i/16 + 1) + ": ";
            }
            pmkidsHtml += uint8ToHex(attack_content[index + i]);
        }
        
        let contentEl = document.getElementById("result-content");
        contentEl.innerHTML = `
            <p><strong>SSID:</strong> ${ssid_text} (<small>${ssid}</small>)</p>
            <p><strong>BSSID (AP):</strong> ${mac_ap}</p>
            <p><strong>Client (STA):</strong> ${mac_sta}</p>
            <div style="margin-top:10px">
                <strong>PMKID(s):</strong>
                <pre>${pmkidsHtml}</pre>
            </div>
            <div style="margin-top:10px">
                <strong>Hashcat String:</strong>
                <pre>${pmkidsHtml}*${mac_ap}*${mac_sta}*${ssid}</pre>
            </div>
        `;
    }

    function resultHandshake(attack_content, attack_content_size){
        let contentEl = document.getElementById("result-content");
        contentEl.innerHTML = `
            <div style="display:flex; gap:10px; margin-bottom:15px;">
                <a href="/capture.pcap" target="_blank"><button class="btn-sm">Download .PCAP</button></a>
                <a href="/capture.hccapx" target="_blank"><button class="btn-sm">Download .HCCAPX</button></a>
                <a href="/capture.hc22000" target="_blank"><button class="btn-sm">Download .HC22000</button></a>
            </div>
            <strong>Captured Handshake Frames (Hex):</strong>
        `;
        
        var handshakes = "";
        for(let i = 0; i < attack_content_size; i++) {
            handshakes += uint8ToHex(attack_content[i]);
            if(i % 50 == 49) handshakes += "\n";
        }
        contentEl.innerHTML += "<pre>" + handshakes + "</pre>";
    }

    function uint8ToHex(uint8){
        return ("00" + uint8.toString(16)).slice(-2);
    }

    function updateConfigurableFields(el){
        // Clear children
        var methodSelect = document.getElementById("attack_method");
        methodSelect.innerHTML = "";
        
        switch(parseInt(el.value)){
            case AttackTypeEnum.ATTACK_TYPE_PASSIVE:
                // Not implemented
                break;
            case AttackTypeEnum.ATTACK_TYPE_HANDSHAKE:
                document.getElementById("attack_timeout").value = 60;
                setAttackMethods(["Deauth Rogue AP (Passive)", "Deauth Broadcast (Active)", "Capture Only (Passive)"]);
                break;
            case AttackTypeEnum.ATTACK_TYPE_PMKID:
                document.getElementById("attack_timeout").value = 5;
                setAttackMethods(["PMKID Attack"]); // Usually just one default method implied? Original code didn't set methods for PMKID?
                // Original code: PMKID config -> value=5, break. Didn't call setAttackMethods.
                // So drop down is empty? Original logic: "defaultAttackMethods" was saved.
                // But in original code, PMKID case didn't add options. Is it auto-selected or fixed?
                // Looking at C code: attack_pmkid.cpp doesn't seem to differentiate methods much.
                // Let's add a default "Default" option.
                setAttackMethods(["Default"]);
                break;
            case AttackTypeEnum.ATTACK_TYPE_DOS:
                document.getElementById("attack_timeout").value = 120;
                setAttackMethods(["Deauth Rogue AP", "Deauth Broadcast", "Deauth Combine All"]);
                break;
        }
        methodSelect.removeAttribute("disabled");
    }

    function setAttackMethods(methods){
        var methodSelect = document.getElementById("attack_method");
        methods.forEach(function(m, i){
            var opt = document.createElement("option");
            opt.value = i;
            opt.text = m;
            // Original logic selected them all? No, that's weird. Just select first.
            if(i==0) opt.selected=true;
            methodSelect.appendChild(opt);
        });
    }
    
    // Init default storage
    defaultAttackMethods = document.getElementById("attack_method").innerHTML;
    </script>
</body>
</html>
